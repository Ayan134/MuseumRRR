# WebSocket для /tgws/ (Telegram): Upgrade пробрасываем, только если клиент его прислал.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Дефолт nginx (1m) режет аватарки/файлы Хранилища раньше, чем запрос долетает
    # до бэкенда (MAX_AVATAR_BYTES=5MB, reports_storage.MAX_FILE_BYTES=500MB) — 413
    # на любом реальном фото с телефона. Ставим с запасом над самым большим лимитом.
    client_max_body_size 550m;

    # Docker internal DNS — re-resolve upstreams every 10s
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Сжатие
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # MinIO static files (avatars, public assets)
    location ^~ /storage/ {
        set $minio_upstream http://minio:9000;
        rewrite ^/storage/(.*) /$1 break;
        proxy_pass $minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API proxy — strip /api prefix, forward to FastAPI
    location /api/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE: отключаем буферизацию для stream-эндпоинтов
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ── Telegram во вкладке (раздел «Telegram», backend/app/routers/telegram.py) ──
    # Клиент Telegram Web K — статикой из public/tg/. Пускаем только с кукой
    # meridian_tg (её выдаёт POST /api/tg/session со страницы /telegram), проверка —
    # подзапросом в API. Исключение — скрипт service worker'а: Chromium запрашивает
    # его без куки, а с 401 SW не регистрируется (файл без данных, доступ к самому
    # Telegram через /tgws/ всё равно только по куке).
    location = /_tg_auth {
        internal;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream/tg/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }

    location @tg_unauthorized {
        # Открыли /tg/ отдельной вкладкой без куки — на страницу раздела, она выдаст куку.
        if ($http_sec_fetch_dest = document) {
            return 302 /telegram;
        }
        return 401;
    }

    location ^~ /tg/ {
        auth_request /_tg_auth;
        error_page 401 = @tg_unauthorized;
        # Своя CSP: клиенту нужны blob:/wasm/воркеры, opus-воркеры голосовых собраны
        # emscripten'ом (new Function -> 'unsafe-eval'). frame-ancestors 'self' — для iframe.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; frame-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;

        location ~ ^/tg/sw-[A-Za-z0-9_-]+\.js$ {
            auth_request off;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' blob: data:" always;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
    }

    # MTProto-прокси до *.web.telegram.org (WebSocket + HTTPS-транспорт). Префикс НЕ
    # обрезаем — роутер в API висит на /tgws/. Host пробрасываем исходный ($http_host,
    # с портом) — API сверяет с ним Origin у WebSocket.
    location ^~ /tgws/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 3m;
    }

    # Статика с кешированием
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: все неизвестные роуты отдают index.html (TanStack Router разберётся)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
